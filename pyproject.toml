[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tina4-groundwire"
version = "0.1.0"
description = "Groundwire: a retrieval + verification layer that grounds an LLM in your own source. Off-GPU corpus, only the top-k reaches the model. Ships a long-context NIAH recall harness."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Andre van Zuydam", email = "andrevanzuydam@gmail.com" }]
keywords = [
    "retrieval", "rag", "grounding", "context", "verification",
    "long-context", "needle-in-a-haystack", "llm", "bm25", "tina4",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
    "Intended Audience :: Developers",
]
dependencies = []

# Core carries ZERO runtime deps — same ethos as tina4-python. The dense backend
# needs no numpy (vector math is pure stdlib, groundwire/veclite.py) and the
# encoder is our own stdlib HTTP client (Ollama / vLLM), not sentence-transformers.
[project.optional-dependencies]
qwen = ["transformers", "torch", "accelerate"]  # optional local reader only
mcp = ["tina4-python"]                           # experimental MCP server (built on Tina4)
docs = ["pypdf"]                                 # index PDFs in the drop folder (.docx is stdlib)
app = ["pystray", "pillow", "pypdf"]             # experimental desktop tray + drop-folder ingest
desktop = ["pywebview", "pypdf", "keyring"]      # native-window app (webview UI + chat/backends)

[project.urls]
Homepage = "https://github.com/tina4stack/groundwire"
Repository = "https://github.com/tina4stack/groundwire"
Issues = "https://github.com/tina4stack/groundwire/issues"

[project.scripts]
groundwire-bench = "groundwire.harness:main"             # long-context NIAH recall harness
groundwire-server = "groundwire.server:main"             # experimental OpenAI-compat proxy
groundwire-mcp = "groundwire.mcp_server:main"            # experimental Tina4-stack MCP server
groundwire-proxy = "groundwire.proxy:main"               # experimental drop-in Ollama proxy
groundwire-web = "groundwire.webapp:main"                # web UI + chat API (browser)
groundwire-app = "groundwire.desktop:main"               # native desktop window (webview UI)

[tool.setuptools]
packages = ["groundwire"]

[tool.setuptools.package-data]
groundwire = ["assets/*.png", "assets/*.ico", "webui/*"]

# --------------------------------------------------------------------------- #
# Briefcase — package the desktop app into a signed .dmg (macOS) / .msi (Win). #
# The bundle runs `python -m gwapp`, a thin launcher for groundwire.desktop    #
# (groundwire's own __main__ is the CLI harness). See docs/PACKAGING.md.       #
# --------------------------------------------------------------------------- #
[tool.briefcase]
project_name = "Groundwire"
bundle = "com.tina4stack"
version = "0.1.0"
url = "https://github.com/tina4stack/groundwire"
author = "Andre van Zuydam"
author_email = "andrevanzuydam@gmail.com"
license.file = "LICENSE"

[tool.briefcase.app.gwapp]
formal_name = "Groundwire"
description = "Ground a chat model in your own source — retrieval + verification in front of the LLM, on your machine."
sources = ["gwapp", "groundwire"]
# Pin pywebview: Briefcase's bundle resolver otherwise pulls 3.4, whose start()
# lacks the `icon=` kwarg desktop.py uses (TypeError at launch). 6.x matches dev.
requires = ["pywebview==6.2.1", "pypdf", "keyring"]
icon = "groundwire/assets/groundwire"

[tool.briefcase.app.gwapp.macOS]
requires = ["std-nslog~=1.0"]

[tool.briefcase.app.gwapp.windows]
# pywebview's Windows (WebView2/WinForms) backend needs pythonnet.
requires = ["pythonnet>=3.0.0"]
